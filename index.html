<style>
  :root {
    --bg-deep: #030712;
    --bg-panel: rgba(15,23,42,0.6);
    --glass-border: rgba(255,255,255,0.08);
    --glass-highlight: rgba(255,255,255,0.15);
    --accent-cyan: #22d3ee;
    --accent-blue: #60a5fa;
    --accent-purple: #a78bfa;
    --accent-rose: #fb7185;
    --accent-amber: #fbbf24;
    --accent-emerald: #34d399;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg-deep);
    color: #e2e8f0;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  /* Animated gradient background */
  .ambient-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 20% 40%, rgba(34,211,238,0.12), transparent),
      radial-gradient(ellipse 60% 60% at 80% 20%, rgba(167,139,250,0.10), transparent),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(96,165,250,0.08), transparent);
    animation: ambientMove 20s ease-in-out infinite alternate;
  }
  @keyframes ambientMove {
    0% { transform: scale(1) translate(0,0); }
    100% { transform: scale(1.1) translate(-2%, -1%); }
  }
  /* Glass card base */
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 4px 24px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .glass-strong {
    background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
    backdrop-filter: blur(40px) saturate(1.6);
    -webkit-backdrop-filter: blur(40px) saturate(1.6);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .glass-hover:hover {
    background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  /* Glow effects */
  .glow-cyan { box-shadow: 0 0 20px rgba(34,211,238,0.15); }
  .glow-purple { box-shadow: 0 0 20px rgba(167,139,250,0.15); }
  .glow-rose { box-shadow: 0 0 20px rgba(251,113,133,0.15); }
  .glow-amber { box-shadow: 0 0 20px rgba(251,191,36,0.15); }
  .glow-emerald { box-shadow: 0 0 20px rgba(52,211,153,0.15); }
  .text-glow-cyan { text-shadow: 0 0 20px rgba(34,211,238,0.4); }
  .text-glow-purple { text-shadow: 0 0 20px rgba(167,139,250,0.4); }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  /* Page transitions */
  .page { display: none; animation: fadeIn 0.35s cubic-bezier(0.4,0,0.2,1); }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }
  @keyframes pulse-soft { 0%,100%{opacity:1} 50%{opacity:.7} }
  .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1) both; }
  .animate-delay-1 { animation-delay: 0.08s; }
  .animate-delay-2 { animation-delay: 0.16s; }
  .animate-delay-3 { animation-delay: 0.24s; }
  .animate-delay-4 { animation-delay: 0.32s; }
  /* Progress ring */
  .progress-ring-circle { transition: stroke-dashoffset 0.5s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
  /* Floating particles */
  .particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.6); pointer-events: none; animation: floatParticle linear infinite; }
  @keyframes floatParticle { 0%{transform:translateY(100vh) scale(0); opacity:0} 10%{opacity:0.6} 90%{opacity:0.6} 100%{transform:translateY(-10vh) scale(1); opacity:0} }
  /* Pomodoro */
  .timer-ring { transition: stroke-dashoffset 1s linear; }
  /* Flashcard flip */
  .flip-card { perspective: 1000px; }
  .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip-card-back { transform: rotateY(180deg); }
  /* Highlight toolbar */
  .highlight-toolbar { position: absolute; display:none; z-index:50; }
  .highlight-toolbar.show { display:flex; }
  /* Bottom nav */
  .bottom-nav-item.active { color: var(--accent-cyan); }
  .bottom-nav-item.active::before {
    content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:24px; height:3px; border-radius:2px; background:var(--accent-cyan);
    box-shadow:0 0 8px var(--accent-cyan);
  }
  /* Reading progress bar */
  .reading-progress { position:fixed; top:0; left:0; height:3px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); z-index:100; transition: width 0.1s; }
  /* Modal */
  .modal-overlay { background: rgba(3,7,18,0.85); backdrop-filter: blur(8px); }
  /* Toast */
  .toast { animation: toastIn 0.4s cubic-bezier(0.4,0,0.2,1), toastOut 0.4s cubic-bezier(0.4,0,0.2,1) 2.6s forwards; }
  @keyframes toastIn { from { transform: translateY(20px) scale(0.95); opacity:0 } to { transform: translateY(0) scale(1); opacity:1 } }
  @keyframes toastOut { to { transform: translateY(20px) scale(0.95); opacity:0 } }
  /* Custom checkbox/radio */
  .option-card { transition: all 0.2s; cursor: pointer; }
  .option-card:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }
  .option-card.selected { border-color: var(--accent-cyan); background: rgba(34,211,238,0.08); }
  .option-card.correct { border-color: var(--accent-emerald); background: rgba(52,211,153,0.1); }
  .option-card.wrong { border-color: var(--accent-rose); background: rgba(251,113,133,0.1); }
  /* Sticky note */
  .note-card { transition: all 0.2s; }
  .note-card:hover { transform: translateY(-2px); }
  /* Search highlight */
  mark { background: rgba(251,191,36,0.3); color: inherit; border-radius: 2px; padding: 0 2px; }
  /* Mobile safe area */
  .pb-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
</style>

<script>
/* ===================== DATA: ALL 12 MATERIALS ===================== */
const MATERIALS = [
{
  id: "neuro1", title: "Neuroanatomi 1: SSP & Neuron", category: "Neuroanatomi",
  summary: "Anatomi otak, sumsum tulang belakang, neuron, neuroglia, dan fungsi sistem saraf.",
  readTime: 8,
  content: `
<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Sistem Saraf Pusat (SSP)</h3>
<p class="mb-3 text-slate-300 leading-relaxed">SSP terdiri dari <b>otak</b> dan <b>sumsum tulang belakang</b>, dilindungi tulang, meninges, dan cairan serebrospinal (CSF). Fungsinya: menerima data, mengolahnya, lalu memerintahkan organ tubuh untuk menjaga <b>homeostasis</b> (kondisi seimbang dalam tubuh).</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">3 Fungsi Sistem Saraf</h3>
<ul class="space-y-2 mb-3 text-slate-300">
<li><b class="text-white">1. Kewaspadaan:</b> Mengetahui perubahan di sekitar melalui alat indera → saraf sensorik mengirim data ke pusat.</li>
<li><b class="text-white">2. Integrasi:</b> Otak menafsirkan data sensorik, menggabungkannya dengan memori, lalu menentukan respons.</li>
<li><b class="text-white">3. Koordinasi:</b> Otak mengirim perintah ke otot dan kelenjar untuk gerak & sekresi terorganisir.</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Struktur Neuron</h3>
<ul class="space-y-2 mb-3 text-slate-300">
<li><b>Badan sel:</b> Pusat metabolisme & genetik sel saraf.</li>
<li><b>Dendrit:</b> Menerima sinyal dari neuron lain.</li>
<li><b>Axon:</b> Satu batang panjang yang mengirim sinyal keluar. Dibungkus <b>mielin</b> (selubang lemak) untuk mempercepat transmisi.</li>
<li><b>Sinaps:</b> Titik kontak antar neuron. Neurotransmitter (seperti asetilkolin) dilepaskan untuk menyampaikan sinyal.</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Neuroglia (Sel Pendukung)</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Neuroglia lebih banyak dari neuron. Terdiri dari: <b>Astrosit</b> (memberi nutrisi), <b>Oligodendrosit</b> (membuat mielin di SSP), <b>Mikroglia</b> (kekebalan), dan <b>ependim</b> (melapisi ventrikel).</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Otak Besar (Cerebrum)</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Bagian terbesar otak. Terdiri dari 2 hemisfer (kiri & kanan). Permukaannya berkerut (giri & sulkus). Ada 4 lobus utama:</p>
<ul class="space-y-1 mb-3 text-slate-300">
<li><b>Frontal:</b> Pengambilan keputusan, gerak sadar.</li>
<li><b>Parietal:</b> Perasaan & integrasi sensorik.</li>
<li><b>Temporal:</b> Pendengaran & memori.</li>
<li><b>Oksipital:</b> Penglihatan.</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Talamus & Hipotalamus</h3>
<p class="mb-3 text-slate-300 leading-relaxed"><b>Talamus:</b> Stasiun relay (persimpangan) semua impuls sensorik sebelum ke korteks. <b>Hipotalamus:</b> Mengatur suhu, denyut jantung, tekanan darah, keseimbangan air, nafsu makan, dan hormon endokrin.</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Batang Otak & Otak Kecil</h3>
<p class="mb-3 text-slate-300 leading-relaxed"><b>Batang otak</b> = midbrain + pons + medula oblongata. Mengandung <b>ARAS</b> (sistem aktivasi retikuler) yang mengatur kesadaran. <b>Cerebellum</b> (otak kecil) mengontrol keseimbangan, koordinasi gerak halus, dan tonus otot.</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Sumsum Tulang Belakang</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Terdiri dari <b>zat abu-abu</b> (H shape di tengah, neuron) dan <b>zat putih</b> (di luar, serat mielin). Ada 31 pasang saraf spinal: 8 serviks, 12 toraks, 5 lumbar, 5 sakral, 1 koksigeal.</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Jalur Saraf</h3>
<ul class="space-y-2 mb-3 text-slate-300">
<li><b>Ascending (naik):</b> Jalur sensorik → membawa rasa sakit, suhu, sentuhan, dan propriocepsi ke otak. Contoh: <i>spinothalamic tract</i>.</li>
<li><b>Descending (turun):</b> Jalur motorik → membawa perintah gerak dari otak ke otot. Contoh: <i>corticospinal tract</i> (jalur piramidal).</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Pembuluh Darah Otak & CSF</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Otak disuplai oleh <b>arteri karotis interna</b> (depan) dan <b>arteri vertebral</b> (belakang, membentuk basilar artery). Beranastomosis membentuk <b>Poligon Willis</b> untuk cadangan darat. <b>CSF</b> diproduksi di plexus koroidus ventrikel, bersirkulasi, lalu diserap di granulasi arachnoid. Volume normal ~150 mL.</p>
`,
  important_points: [
    "SSP = Otak + Sumsum tulang belakang",
    "Neuron = badan sel + dendrit + axon + sinaps",
    "Neuroglia: astrosit, oligodendrosit, mikroglia",
    "4 lobus: frontal, parietal, temporal, oksipital",
    "Talamus = relay station; Hipotalamus = regulator vital",
    "31 pasang saraf spinal: C8 T12 L5 S5 Co1",
    "CSF ~150 mL, melindungi & menyangga otak"
  ],
  flashcards: [
    { q: "Apa saja 3 fungsi sistem saraf?", a: "Kewaspadaan (sensorik), Integrasi (olah data), Koordinasi (perintah ke otot/kelenjar)." },
    { q: "Apa perbedaan zat abu-abu dan zat putih di sumsum tulang belakang?", a: "Zat abu-abu di tengah (badan sel neuron). Zat putih di luar (serat mielin)." },
    { q: "Apa fungsi Talamus?", a: "Stasiun relay (persimpangan) semua impuls sensorik sebelum sampai ke korteks serebral." },
    { q: "Berapa pasang saraf spinal manusia?", a: "31 pasang: 8 serviks, 12 toraks, 5 lumbar, 5 sakral, 1 koksigeal." },
    { q: "Apa itu Poligon Willis?", a: "Anastomosis arteri karotis interna dan vertebralis di dasar otak untuk cadangan suplai darah." }
  ],
  quiz: [
    { q: "Bagian otak yang mengatur suhu tubuh dan nafsu makan adalah?", options: ["Talamus","Hipotalamus","Cerebellum","Pons"], correct: 1, explanation: "Hipotalamus mengatur fungsi vital: suhu, tekanan darah, nafsu makan, dan hormon." },

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Meninges (Penutup Otak)</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Ada 3 lapis:</p>
<ul class="space-y-2 mb-3 text-slate-300">
<li><b>Dura mater:</b> Terluar, tebal & kuat. Di kepala menempel pada tulang (periosteal layer), di punggung hanya lapisan meningeal.</li>
<li><b>Arachnoid:</b> Tengah, tipis seperti jaring laba-laba. Tidak berpembuluh & tak bersaraf. Di bawahnya ada <b>ruang subarachnoid</b> berisi CSF.</li>
<li><b>Pia mater:</b> Terdalam, sangat tipis & menempel erat pada otak. Mengandung banyak pembuluh darah yang mensuplai jaringan saraf.</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Cairan Serebrospinal (CSF)</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Cairan bening yang melindungi otak secara mekanik (bantalan) dan kimiawi (stabilisasi ion). Dihasilkan oleh <b>sel ependymal</b> di <b>plexus koroidus</b> dinding ventrikel. Total 4 ventrikel: 2 lateral, III, dan IV. CSF mengalir: ventrikel lateral → foramen Monroe → ventrikel III → akuadukus Sylvii → ventrikel IV → foramen Luschka & Magendi → ruang subarachnoid → granulasi arachnoid → sinus sagitalis superior → vena jugularis interna. Volume ~150 mL.</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Sirkulasi Darah Otak</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Otak disuplai oleh 2 sistem:</p>
<ul class="space-y-2 mb-3 text-slate-300">
<li><b>Sirkulasi anterior (karotis):</b> Arteri karotis interna masuk melalui kanalis karotikus. Menyuplai sebagian besar hemisfer (frontal, parietal, temporal). Cabang: arteri serebri anterior (ACA) & tengah (MCA).</li>
<li><b>Sirkulasi posterior (vertebrobasilar):</b> Dua arteri vertebralis naik melalui foramen transversaria vertebra serviks C1-C6, bergabung di batas pontomedular membentuk <b>arteri basilaris</b>. Menyuplai batang otak, cerebellum, dan lobus oksipital. Berakhir sebagai 2 arteri serebri posterior (PCA).</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Circulus Arteriosus (Poligon Willis)</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Terletak di fossa interpedunkularis dasar otak. Dibentuk oleh anastomosis ACA, ACom (arteri komunikan anterior), ICA, PCom (posterior communicating), dan PCA. Fungsinya: jika salah satu arteri tersumbat, darah masih bisa mengalir dari arteri lain (kolateral).</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Vena Otak</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Vena serebral tidak memiliki katup. Terbagi:</p>
<ul class="space-y-1 mb-3 text-slate-300">
<li><b>Superfisial:</b> Vena serebral superior & inferior → sinus sagitalis/transversus.</li>
<li><b>Dalam:</b> Vena serebral dalam (gabungan vena talamostriata & koroid) → sinus rektus → sinus transversus.</li>
<li><b>Sinus dural:</b> Kanal antar lapisan dura yang mengumpulkan darah vena & CSF. Contoh: sagitalis superior, transversus, sigmoideus → vena jugularis interna.</li>
</ul>

<li><b>Parasimpatis:</b> Kraniosakral (CN III, VII, IX, X & S2-S4). "Rest and digest". Neurotransmitter <b>asetilkolin</b>.</li>
<li><b>Enteric:</b> Sistem saraf pencernaan, bisa bekerja mandiri tapi diatur simpatis/parasimpatis.</li>

<thead class="bg-white/5 text-white"><tr><th class="px-3 py-2 text-left">Ciri</th><th class="px-3 py-2 text-left">Simpatis</th><th class="px-3 py-2 text-left">Parasimpatis</th></tr></thead>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Neurotransmitter ANS</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Semua serat <b>preganglionik</b> (simpatis & parasimpatis) melepaskan <b>asetilkolin</b> → reseptor <b>nikotinik</b> di ganglion. Serat <b>postganglionik parasimpatis</b> melepaskan <b>asetilkolin</b> → reseptor <b>muskarinik</b> di organ. Serat <b>postganglionik simpatis</b> melepaskan <b>norepinefrin</b> (kecuali ke kelenjar keringat & medula adrenal yang pakai ACh).</p>

</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Kornea (5 Lapis)</h3>
<ol class="list-decimal list-inside space-y-1 mb-3 text-slate-300">
<li><b>Epitel kornea:</b> Stratified squamous non-keratinized, 5-6 lapis, dengan mikrovilli menjaga kelembaban.</li>

<p class="mb-3 text-slate-300 leading-relaxed">Zona transisi kornea ke sklera. Mengandung <b>sel punca limbal</b> yang meregenerasi epitel kornea. Juga mengandung <b>trabekular meshwork</b> & <b>sinus vena sklera (kanalis Schlemm)</b> untuk drainase humor akvosa.</p>

<p class="mb-3 text-slate-300 leading-relaxed"><b>RPE:</b> Simple cuboidal pigmen. Fungsi: metabolisme vitamin A, fagositosis segmen luar fotoreseptor, penyerapan cahaya, blood-retina barrier luar.</p>

<li><b>Koklear:</b> <b>Duktus koklear (scala media)</b> mengandung <b>organ of Corti</b> (reseptor pendengaran). Dibatasi <b>membran Reissner</b> (atas, ke scala vestibuli) & <b>membran basilaris</b> (bawah, ke scala tympani).</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Organ of Corti</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Terletak di membran basilaris. Komponen:</p>
<ul class="space-y-1 mb-3 text-slate-300">
<li><b>Sel rambut (hair cells):</b> Neuroepitel, tidak ada kinosilia (kecuali vestibular). Stereocilia panjang & kaku menembus <b>membran tektorial</b>. Terbagi <b>inner hair cells</b> (1 baris, 95% aferen) & <b>outer hair cells</b> (3 baris, motilitas/amplifikasi).</li>
<li><b>Sel penunjang:</b> Pilar cells (bentuk terowongan), Deiters' cells, cells of Claudius, Boettcher.</li>
<li><b>Membran basilaris:</b> Tonotopik — pangkal (dekat jendela oval) = frekuensi tinggi, apeks (helicotrema) = frekuensi rendah.</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Stria Vaskularis & Koklea</h3>
<p class="mb-3 text-slate-300 leading-relaxed"><b>Stria vaskularis:</b> Epitel pseudostratified vaskular di dinding lateral duktus koklear. Menghasilkan & memelihara endolymph (K+ tinggi). <b>Spiral prominence</b> & <b>external spiral sulcus</b> berlanjut ke sel Claudius.</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Mekanisme Pendengaran</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Gelombang suara → aurikel → meatus → vibrasi timpani → ossicles (malleus→incus→stapes) → jendela oval → gelombang perilymph di scala vestibuli → vibrasi membran basilaris → geseran stereocilia sel rambut terhadap membran tektorial → potensial reseptor → neurotransmitter → saraf koklear (CN VIII) → batang otak → korteks pendengaran.</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Fotoreseptor: Batang & Kerucut</h3>
<ul class="space-y-2 mb-3 text-slate-300">
<li><b>Batang (rods):</b> Panjang & tipis. Protein <b>rhodopsin</b> (warna merah muda/ungu). Tersebar di seluruh retina kecuali fovea (~100 juta). Fungsi: visi malam (skotopik), sensitivitas tinggi, resolusi rendah. Gangguan: rabun ayam (night blindness).</li>
<li><b>Kerucut (cones):</b> Pendek & tebal. Protein <b>iodopsin/fotopsin</b> (3 tipe: biru, hijau, merah). Terkonsentrasi di fovea (~7 juta). Fungsi: visi siang (fotopik), warna, resolusi tinggi. Gangguan: buta warna.</li>
</ul>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Mekanisme Fototransduksi</h3>
<p class="mb-3 text-slate-300 leading-relaxed"><b>Keadaan gelap:</b> cGMP tinggi → kanal Na+ terbuka (dark current) → depolarisasi (-30 mV) → release glutamat (inhibitor) → hiperpolarisasi sel bipolar → sinyal ke ganglion terhambat.</p>
<p class="mb-3 text-slate-300 leading-relaxed"><b>Keadaan terang:</b> cahaya → isomerisasi retinal (11-cis ke all-trans) → aktivasi rhodopsin → aktivasi transducin (G-protein) → aktivasi phosphodiesterase (PDE) → hidrolisis cGMP → kanal Na+ tertutup → <b>hiperpolarisasi</b> fotoreseptor → release glutamat berkurang → <b>eksitasi</b> sel bipolar (tipe ON) → potensial aksi sel ganglion.</p>
<p class="mb-3 text-slate-300 leading-relaxed">Unik: fotoreseptor <b>hiperpolarisasi</b> saat menerima cahaya (bukan depolarisasi seperti reseptor lain).</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Akomodasi Mata</h3>
<p class="mb-3 text-slate-300 leading-relaxed">Kemampuan lensa mengubah kelengkungan untuk fokus dekat/jauh:</p>
<ul class="space-y-1 mb-3 text-slate-300">
<li><b>Melihat jauh:</b> Otot siliaris relaksasi → ligamentum suspensorium tegang → lensa mendatar (tipis) → kekuatan refraksi rendah.</li>
<li><b>Melihat dekat:</b> Otot siliaris kontraksi (parasimpatis via CN III) → ligamentum kendur → lensa lebih bulat (cembung) → kekuatan refraksi tinggi.</li>
</ul>
<p class="mb-3 text-slate-300 leading-relaxed">Dengan usia, elastisitas lensa berkurang → <b>presbiopia</b> (sulit baca dekat).</p>

<h3 class="text-lg font-bold text-cyan-300 mt-4 mb-2">Gangguan Refraksi</h3>
<ul class="space-y-2 mb-3 text-slate-300">
<li><b>Myopia (rabun jauh):</b> Sinar fokus di depan retina. Koreksi: lensa cekung negatif.</li>
<li><b>Hypermetropia (rabun dekat):</b> Sinar fokus di belakang retina. Koreksi: lensa cembung positif.</li>
<li><b>Astigmatisma:</b> Kelengkungan kornea tidak merata. Koreksi: lensa silinder.</li>
<li><b>Presbiopia:</b> Kehilangan akomodasi karena kekakuan lensa pada usia >40 tahun.</li>
</ul>

  pomodoro: { time: 25*60, running: false, mode: 'focus', interval: null },
  exam: { active: false, current: 0, answers: [], timeLeft: 0, timer: null, questions: [] },
  quiz: { active: false, current: 0, score: 0, answers: [], questions: [] },
  flash: { active: false, cards: [], current: 0, shuffled: false },
  highlights: JSON.parse(localStorage.getItem('medstudy_highlights') || '{}'),

  init() {
    this.renderParticles();
    this.goTo('dashboard');
    this.updateNav();
    this.checkStreak();
    window.addEventListener('hashchange', () => {
      const hash = location.hash.replace('#','') || 'dashboard';
      if(hash !== this.currentPage) this.goTo(hash);
    });
  },

  save() {
    localStorage.setItem('medstudy_notes', JSON.stringify(this.notes));
    localStorage.setItem('medstudy_bookmarks', JSON.stringify(this.bookmarks));
    localStorage.setItem('medstudy_progress', JSON.stringify(this.progress));
    localStorage.setItem('medstudy_quiz', JSON.stringify(this.quizScores));
    localStorage.setItem('medstudy_exam', JSON.stringify(this.examScores));
    localStorage.setItem('medstudy_flash', JSON.stringify(this.flashProgress));
    localStorage.setItem('medstudy_timer', JSON.stringify(this.timerStats));
    localStorage.setItem('medstudy_streak', String(this.streak));
    localStorage.setItem('medstudy_last', this.lastStudy);
    localStorage.setItem('medstudy_highlights', JSON.stringify(this.highlights));
  },

  checkStreak() {
    const today = new Date().toDateString();
    if(this.lastStudy && this.lastStudy !== today) {
      const last = new Date(this.lastStudy);
      const diff = Math.floor((new Date()-last)/(1000*60*60*24));
      if(diff > 1) this.streak = 0;
    }
  },

  recordStudy() {
    const today = new Date().toDateString();
    if(this.lastStudy !== today) {
      if(this.lastStudy) {
        const last = new Date(this.lastStudy);
        const diff = Math.floor((new Date()-last)/(1000*60*60*24));
        if(diff === 1) this.streak++;
        else if(diff > 1) this.streak = 1;
      } else this.streak = 1;
      this.lastStudy = today;
      this.save();
    }
  },

  goTo(page, param=null) {
    this.currentPage = page;
    location.hash = page;
    this.updateNav();
    const main = document.getElementById('mainContent');
    main.scrollTop = 0;
    document.getElementById('readingProgress').style.width = '0%';
    if(page === 'dashboard') this.renderDashboard();
    else if(page === 'materials') this.renderMaterials();
    else if(page === 'material' && param) this.renderMaterial(param);
    else if(page === 'flashcards') this.renderFlashcards();
    else if(page === 'quiz') this.renderQuizMenu();
    else if(page === 'quiz-run') this.renderQuizRun();
    else if(page === 'exam') this.renderExamMenu();
    else if(page === 'exam-run') this.renderExamRun();
    else if(page === 'notes') this.renderNotes();
    else if(page === 'bookmarks') this.renderBookmarks();
    else if(page === 'stats') this.renderStats();
    else if(page === 'settings') this.renderSettings();
    else if(page === 'pomodoro') this.renderPomodoro();
    else this.renderDashboard();
  },

  updateNav() {
    document.querySelectorAll('.bottom-nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.page === this.currentPage);
    });
  },

              <span class="text-[10px] uppercase tracking-widest text-cyan-500 mb-4">Jawaban</span>

        <div class="flex gap-2 mt-4">

          <button onclick="app.markFlashKnown()" class="px-3 py-2 rounded-lg glass text-xs text-emerald-300 hover:bg-emerald-500/10">Sudah Hafal</button>
        </div>
      </div>` : '<p class="text-center text-slate-500 py-20">Tidak ada flashcard.</p>'}
    </div>`;

  flipCard() { document.getElementById('flashCard').classList.toggle('flipped'); },
  prevCard() { this.flash.current = (this.flash.current-1+this.flash.cards.length)%this.flash.cards.length; this.updateFlash(); },
  nextCard() { this.flash.current = (this.flash.current+1)%this.flash.cards.length; this.updateFlash(); },
  shuffleFlash() { this.flash.cards.sort(()=>Math.random()-0.5); this.flash.current=0; this.updateFlash(); this.toast('Flashcard diacak'); },
  markFlashKnown() {
    const c = this.flash.cards[this.flash.current];
    this.flashProgress[c.id] = (this.flashProgress[c.id]||0)+1;
    this.save();
    this.toast('Ditandai hafal!');
    this.nextCard();
  },
  updateFlash() {
    const c = this.flash.cards[this.flash.current];
    const el = document.getElementById('flashCard');
    el.classList.remove('flipped');
    setTimeout(() => {
      el.querySelector('.flip-card-front p').textContent = c.q;
      el.querySelector('.flip-card-back p').textContent = c.a;
      document.getElementById('flashCounter').textContent = this.flash.current+1;
    }, 300);
  },

  renderQuizMenu() {

  startQuiz(id) {
    let qs = [];
    if(id==='all') MATERIALS.forEach(m => m.quiz.forEach(q => qs.push({...q, matId:m.id, matTitle:m.title})));

    if(!qs.length) return this.toast('Tidak ada soal');
    qs.sort(()=>Math.random()-0.5);
    this.quiz = { active:true, current:0, score:0, answers:[], questions: qs.slice(0, Math.min(qs.length, 20)) };

  renderQuizRun() {
    const q = this.quiz.questions[this.quiz.current];
    const total = this.quiz.questions.length;
    const pct = ((this.quiz.current)/total)*100;
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 max-w-lg mx-auto h-full flex flex-col">
      <div class="flex items-center gap-3 mb-4">
        <button onclick="app.goTo('quiz')" class="text-slate-400 hover:text-white"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="flex-1 h-1.5 bg-white/5 rounded-full"><div class="h-full bg-emerald-400 rounded-full transition-all" style="width:${pct}%"></div></div>
        <span class="text-xs text-slate-400">${this.quiz.current+1}/${total}</span>

      <div class="flex-1 flex flex-col">

        <h3 class="text-base font-bold text-white mb-4 leading-snug">${q.q}</h3>
        <div class="space-y-2" id="quizOptions">
          ${q.options.map((opt,i) => `
            <button onclick="app.answerQuiz(${i})" class="option-card w-full glass rounded-xl p-3 text-left text-sm text-slate-300 border border-white/10" data-idx="${i}">
              <span class="inline-block w-6 h-6 rounded-full bg-white/5 text-xs text-slate-400 flex items-center justify-center mr-2 align-middle">${String.fromCharCode(65+i)}</span>
              ${opt}
            </button>
          `).join('')}
        </div>
        <div id="quizFeedback" class="mt-4 hidden glass rounded-xl p-3 text-sm"></div>
        <div class="mt-auto pt-4">
          <button id="quizNext" onclick="app.nextQuiz()" class="w-full py-3 rounded-xl bg-emerald-500/20 text-emerald-300 font-semibold text-sm border border-emerald-500/30 hidden">Soal Berikutnya →</button>
        </div>
      </div>
    </div>`;
  },

  answerQuiz(idx) {
    const q = this.quiz.questions[this.quiz.current];
    const opts = document.querySelectorAll('#quizOptions .option-card');
    opts.forEach((el,i) => {
      el.classList.add('pointer-events-none');
      if(i===q.correct) el.classList.add('correct');
      else if(i===idx && i!==q.correct) el.classList.add('wrong');
    });
    const fb = document.getElementById('quizFeedback');
    fb.classList.remove('hidden');
    fb.innerHTML = idx===q.correct
      ? `<p class="text-emerald-300 font-semibold">✅ Benar!</p><p class="text-slate-400 text-xs mt-1">${q.explanation}</p>`
      : `<p class="text-rose-300 font-semibold">❌ Salah</p><p class="text-slate-300 text-xs mt-1">Jawaban: <b>${q.options[q.correct]}</b>. ${q.explanation}</p>`;
    if(idx===q.correct) this.quiz.score++;
    this.quiz.answers.push({correct: idx===q.correct});
    document.getElementById('quizNext').classList.remove('hidden');
  },

  nextQuiz() {
    this.quiz.current++;
    if(this.quiz.current >= this.quiz.questions.length) {
      // Finish
      const total = this.quiz.questions.length;
      const score = this.quiz.score;
      const matId = this.quiz.questions[0].matId;
      this.quizScores[matId] = { correct: (this.quizScores[matId]?.correct||0)+score, total: (this.quizScores[matId]?.total||0)+total };
      this.save();
      document.getElementById('mainContent').innerHTML = `
      <div class="page active px-4 py-8 max-w-lg mx-auto text-center">
        <div class="w-20 h-20 rounded-full bg-emerald-500/10 flex items-center justify-center mx-auto mb-4 glow-emerald">
          <span class="text-3xl">🎉</span>
        </div>
        <h2 class="text-2xl font-bold text-white">Latihan Selesai!</h2>
        <p class="text-slate-400 text-sm mt-1">Kamu menjawab ${score}/${total} soal dengan benar</p>
        <div class="glass rounded-2xl p-4 mt-6 mx-auto max-w-xs">
          <div class="text-4xl font-bold text-emerald-300">${Math.round((score/total)*100)}%</div>
          <p class="text-xs text-slate-500 mt-1">Akurasi</p>
        </div>
        <div class="flex gap-3 mt-6 justify-center">
          <button onclick="app.goTo('quiz')" class="px-4 py-2 rounded-xl glass text-sm text-white">Kuis Lain</button>
          <button onclick="app.goTo('dashboard')" class="px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-300 text-sm border border-emerald-500/30">Dashboard</button>
        </div>
      </div>`;
    } else this.renderQuizRun();
  },

  /* ---------- RENDER: EXAM ---------- */
  renderExamMenu() {
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 space-y-4 max-w-lg mx-auto">
      <div>
        <h2 class="text-xl font-bold text-white">Simulasi Ujian</h2>

        <button onclick="app.startExam()" class="w-full py-3 rounded-xl bg-cyan-500/20 text-cyan-300 font-semibold text-sm border border-cyan-500/30 hover:bg-cyan-500/30">Mulai Ujian</button>
      </div>

          <div class="flex items-center justify-between py-2 border-b border-white/5 last:border-0">

  startExam() {
    let qs = [];
    MATERIALS.forEach(m => m.quiz.forEach(q => qs.push({...q, matId:m.id, matTitle:m.title})));
    qs.sort(()=>Math.random()-0.5);
    qs = qs.slice(0,30);
    this.exam = { active:true, current:0, answers: new Array(qs.length).fill(null), timeLeft: 30*60, timer: null, questions: qs, finished: false };
    this.goTo('exam-run');
    this.exam.timer = setInterval(() => {
      this.exam.timeLeft--;
      const el = document.getElementById('examTimer');
      if(el) {
        const m = Math.floor(this.exam.timeLeft/60);
        const s = this.exam.timeLeft%60;
        el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
        if(this.exam.timeLeft<=300) el.classList.add('text-rose-300');
      }
      if(this.exam.timeLeft<=0) this.finishExam();
    }, 1000);
  },

  renderExamRun() {
    const q = this.exam.questions[this.exam.current];
    const total = this.exam.questions.length;
    const ans = this.exam.answers[this.exam.current];
    const m = Math.floor(this.exam.timeLeft/60);
    const s = this.exam.timeLeft%60;
    const isLast = this.exam.current === total-1;
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 max-w-lg mx-auto h-full flex flex-col">
      <!-- Header -->
      <div class="flex items-center justify-between mb-3">
        <button onclick="app.confirmFinishExam()" class="flex items-center gap-1 text-xs text-rose-300 hover:text-rose-200 bg-rose-500/10 px-2 py-1 rounded-lg border border-rose-500/20">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          Selesai
        </button>
        <div class="flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-400"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="examTimer" class="text-sm font-mono font-bold text-white">${m}:${s.toString().padStart(2,'0')}</span>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="h-1.5 bg-white/5 rounded-full mb-3 overflow-hidden">
        <div class="h-full bg-cyan-400 rounded-full transition-all" style="width:${((this.exam.current+1)/total)*100}%"></div>
      </div>

      <!-- Question number grid -->
      <div class="flex gap-1.5 mb-3 overflow-x-auto pb-1 no-scrollbar">
        ${this.exam.questions.map((_,i) => `
          <button onclick="app.jumpExam(${i})" class="w-8 h-8 rounded-lg text-xs font-bold shrink-0 transition-all ${i===this.exam.current?'bg-cyan-500 text-white shadow-lg shadow-cyan-500/20':this.exam.answers[i]!==null?'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30':'bg-white/5 text-slate-500 border border-white/10'}">${i+1}</button>
        `).join('')}
      </div>

      <!-- Question content -->
      <div class="flex-1 flex flex-col min-h-0 overflow-y-auto pr-1">
        <span class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">${q.matTitle}</span>
        <h3 class="text-base font-bold text-white mb-4 leading-snug">${this.exam.current+1}. ${q.q}</h3>
        <div class="space-y-2.5">
          ${q.options.map((opt,i) => `
            <button onclick="app.answerExam(${i})" class="option-card w-full glass rounded-xl p-3.5 text-left text-sm text-slate-200 border transition-all ${ans===i?'selected border-cyan-400/60 bg-cyan-500/10 shadow-[0_0_15px_rgba(34,211,238,0.1)]':'border-white/10 hover:border-white/20'}">
              <div class="flex items-center gap-3">
                <span class="w-7 h-7 rounded-full ${ans===i?'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30':'bg-white/5 text-slate-400 border border-white/10'} flex items-center justify-center text-xs font-bold shrink-0">${String.fromCharCode(65+i)}</span>
                <span>${opt}</span>
              </div>
            </button>
          `).join('')}
        </div>
      </div>

      <!-- Bottom navigation -->
      <div class="flex items-center justify-between mt-4 pt-2 border-t border-white/5">
        <button onclick="app.prevExam()" class="flex items-center gap-1 px-4 py-2.5 rounded-xl glass text-xs font-medium text-slate-300 hover:text-white transition-colors ${this.exam.current===0?'opacity-40 pointer-events-none':''}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Sebelumnya
        </button>
        <span class="text-xs text-slate-500 font-medium">${this.exam.current+1} / ${total}</span>
        ${isLast ? `
          <button onclick="app.confirmFinishExam()" class="flex items-center gap-1 px-4 py-2.5 rounded-xl bg-emerald-500/15 text-emerald-300 text-xs font-bold border border-emerald-500/30 hover:bg-emerald-500/25 transition-colors">
            Selesai
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
        ` : `
          <button onclick="app.nextExam()" class="flex items-center gap-1 px-4 py-2.5 rounded-xl glass text-xs font-medium text-white hover:bg-white/10 transition-colors">
            Selanjutnya
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        `}
      </div>
    </div>`;
  },

  answerExam(idx) {
    this.exam.answers[this.exam.current] = idx;
    this.renderExamRun();
  },

  nextExam() {
    if(this.exam.current < this.exam.questions.length-1){
      this.exam.current++;
      this.renderExamRun();
    }
  },

  prevExam() {
    if(this.exam.current > 0){
      this.exam.current--;
      this.renderExamRun();
    }
  },

  jumpExam(i) {
    this.exam.current = i;
    this.renderExamRun();
  },

  confirmFinishExam() {
    const answered = this.exam.answers.filter(a => a!==null).length;
    const total = this.exam.questions.length;
    if(answered < total) {
      if(!confirm(`Kamu baru menjawab ${answered}/${total} soal. Yakin ingin menyelesaikan ujian?`)) return;
    } else {
      if(!confirm('Selesaikan ujian dan lihat hasil?')) return;
    }
    this.finishExam();
  },

  finishExam() {
    if(this.exam.finished) return;
    this.exam.finished = true;
    clearInterval(this.exam.timer);
    let correct = 0;
    this.exam.questions.forEach((q,i) => { if(this.exam.answers[i]===q.correct) correct++; });
    const score = Math.round((correct/this.exam.questions.length)*100);
    this.examScores[Date.now()] = { score, correct, total: this.exam.questions.length };
    this.save();

    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-8 max-w-lg mx-auto text-center">
      <div class="w-20 h-20 rounded-full ${score>=70?'bg-emerald-500/10':'bg-amber-500/10'} flex items-center justify-center mx-auto mb-4 ${score>=70?'glow-emerald':'glow-amber'}">
        <span class="text-3xl">${score>=70?'🎓':'📋'}</span>
      </div>
      <h2 class="text-2xl font-bold text-white">Ujian Selesai!</h2>
      <p class="text-slate-400 text-sm mt-1">${correct}/${this.exam.questions.length} soal benar</p>
      <div class="glass rounded-2xl p-4 mt-6 mx-auto max-w-xs">
        <div class="text-4xl font-bold ${score>=70?'text-emerald-300':'text-amber-300'}">${score}%</div>
        <p class="text-xs text-slate-500 mt-1">${score>=70?'Lulus!':'Perlu latihan lagi'}</p>
      </div>
      <div class="flex flex-col gap-2 mt-6 max-w-xs mx-auto">
        <button onclick="app.renderExamReview()" class="w-full py-3 rounded-xl bg-cyan-500/20 text-cyan-300 font-semibold text-sm border border-cyan-500/30 hover:bg-cyan-500/30 flex items-center justify-center gap-2">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          Lihat Pembahasan
        </button>
        <button onclick="app.goTo('exam')" class="w-full py-3 rounded-xl glass text-sm text-white hover:bg-white/5">Ujian Baru</button>
        <button onclick="app.goTo('dashboard')" class="w-full py-3 rounded-xl bg-white/5 text-slate-300 text-sm hover:bg-white/10">Dashboard</button>
      </div>
    </div>`;
  },

  renderExamReview() {
    const total = this.exam.questions.length;
    let correctCount = 0;
    this.exam.questions.forEach((q,i) => { if(this.exam.answers[i]===q.correct) correctCount++; });

    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 max-w-lg mx-auto pb-24">
      <div class="flex items-center justify-between mb-4">
        <button onclick="app.goTo('exam')" class="flex items-center gap-1 text-xs text-slate-400 hover:text-white">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Kembali
        </button>
        <h2 class="text-sm font-bold text-white">Pembahasan Ujian</h2>
        <span class="text-xs ${correctCount>=total/2?'text-emerald-300':'text-amber-300'}">${correctCount}/${total} Benar</span>
      </div>

      <div class="space-y-4">
        ${this.exam.questions.map((q,i) => {
          const userAns = this.exam.answers[i];
          const isCorrect = userAns === q.correct;
          const isUnanswered = userAns === null;
          return `
          <div class="glass rounded-2xl p-4 ${isCorrect?'border-l-4 border-emerald-400':isUnanswered?'border-l-4 border-amber-400':'border-l-4 border-rose-400'}">
            <div class="flex items-start justify-between gap-2 mb-2">
              <span class="text-xs font-bold text-slate-400">Soal ${i+1}</span>
              <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${isCorrect?'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20':isUnanswered?'bg-amber-500/10 text-amber-300 border border-amber-500/20':'bg-rose-500/10 text-rose-300 border border-rose-500/20'}">
                ${isCorrect?'✅ Benar':isUnanswered?'⚠️ Belum Dijawab':'❌ Salah'}
              </span>
            </div>
            <p class="text-sm font-semibold text-white mb-3">${q.q}</p>
            <div class="space-y-1.5 mb-3">
              ${q.options.map((opt,oi) => {
                const isCorrectOpt = oi === q.correct;
                const isUserOpt = oi === userAns;
                let cls = 'glass rounded-lg p-2.5 text-xs border flex items-center gap-2 ';
                if(isCorrectOpt) cls += 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200';
                else if(isUserOpt && !isCorrect) cls += 'bg-rose-500/10 border-rose-500/30 text-rose-200';
                else cls += 'bg-white/3 border-white/5 text-slate-400';
                return `
                  <div class="${cls}">
                    <span class="w-5 h-5 rounded-full ${isCorrectOpt?'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30':isUserOpt && !isCorrect?'bg-rose-500/20 text-rose-300 border border-rose-500/30':'bg-white/5 text-slate-500 border border-white/10'} flex items-center justify-center text-[10px] font-bold shrink-0">${String.fromCharCode(65+oi)}</span>
                    <span class="flex-1">${opt}</span>
                    ${isCorrectOpt ? '<span class="text-[10px] font-bold text-emerald-300 shrink-0">✓ Kunci</span>' : ''}
                    ${(isUserOpt && !isCorrect) ? '<span class="text-[10px] font-bold text-rose-300 shrink-0">Jawabanmu</span>' : ''}
                  </div>
                `;
              }).join('')}
            </div>
            <div class="bg-white/5 rounded-xl p-3 border border-white/5">
              <p class="text-[10px] uppercase tracking-wider text-cyan-400 font-bold mb-1">Pembahasan</p>
              <p class="text-xs text-slate-300 leading-relaxed">${q.explanation}</p>
            </div>
          </div>
          `;
        }).join('')}
      </div>

      <div class="mt-6 flex gap-3">
        <button onclick="app.goTo('exam')" class="flex-1 py-3 rounded-xl glass text-sm text-white">Ujian Baru</button>
        <button onclick="app.goTo('dashboard')" class="flex-1 py-3 rounded-xl bg-cyan-500/20 text-cyan-300 text-sm border border-cyan-500/30">Dashboard</button>
      </div>
    </div>`;
  },/* ---------- RENDER: NOTES ---------- */
  renderNotes() {
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 space-y-4 max-w-lg mx-auto">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold text-white">Catatan</h2>
        <button onclick="app.editNote()" class="w-8 h-8 rounded-lg bg-rose-500/10 flex items-center justify-center text-rose-300 border border-rose-500/20">+</button>
      </div>
      <div class="space-y-3">
        ${this.notes.length ? this.notes.slice().reverse().map((n,i) => `
          <div class="note-card glass rounded-2xl p-4 relative group">
            <div class="flex items-start justify-between gap-2">
              <h3 class="text-sm font-bold text-white">${n.title}</h3>
              <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="app.editNote(${this.notes.length-1-i})" class="w-7 h-7 rounded-lg bg-white/5 flex items-center justify-center text-slate-400 hover:text-white"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
                <button onclick="app.deleteNote(${this.notes.length-1-i})" class="w-7 h-7 rounded-lg bg-white/5 flex items-center justify-center text-slate-400 hover:text-rose-300"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
              </div>
            </div>
            <p class="text-xs text-slate-400 mt-1 whitespace-pre-wrap">${n.body}</p>
            <p class="text-[10px] text-slate-600 mt-2">${new Date(n.date).toLocaleString('id',{dateStyle:'short',timeStyle:'short'})}</p>
          </div>
        `).join('') : '<p class="text-center text-sm text-slate-500 py-8">Belum ada catatan. Tambahkan catatan baru!</p>'}
      </div>
    </div>`;
  },

  editNote(idx=null) {
    const n = idx!==null ? this.notes[idx] : {title:'',body:''};
    const isNew = idx===null;
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 max-w-lg mx-auto h-full flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <button onclick="app.goTo('notes')" class="text-slate-400 hover:text-white text-sm">Batal</button>
        <button onclick="app.saveNote(${isNew?'null':idx})" class="px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-300 text-xs font-semibold border border-rose-500/30">Simpan</button>
      </div>
      <input id="noteTitle" type="text" value="${n.title}" placeholder="Judul catatan..." class="w-full bg-transparent text-lg font-bold text-white placeholder-slate-600 outline-none mb-3">
      <textarea id="noteBody" placeholder="Tulis catatanmu di sini..." class="flex-1 w-full bg-transparent text-sm text-slate-300 placeholder-slate-600 outline-none resize-none">${n.body}</textarea>
    </div>`;
  },

  saveNote(idx) {
    const title = document.getElementById('noteTitle').value.trim();
    const body = document.getElementById('noteBody').value.trim();
    if(!title && !body) return this.toast('Catatan kosong');
    if(idx===null) this.notes.push({title: title||'Catatan', body, date: Date.now()});
    else this.notes[idx] = {title: title||'Catatan', body, date: Date.now()};
    this.save();
    this.goTo('notes');
    this.toast('Catatan disimpan');
  },

  deleteNote(idx) {
    if(!confirm('Hapus catatan ini?')) return;
    this.notes.splice(idx,1);
    this.save();
    this.renderNotes();
    this.toast('Catatan dihapus');
  },

  /* ---------- RENDER: BOOKMARKS ---------- */
  renderBookmarks() {
    const list = MATERIALS.filter(m => this.bookmarks.includes(m.id));
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 space-y-4 max-w-lg mx-auto">
      <h2 class="text-xl font-bold text-white">Bookmark</h2>
      <div class="space-y-3">
        ${list.length ? list.map(m => `
          <div onclick="app.goTo('material','${m.id}')" class="glass rounded-2xl p-4 cursor-pointer glass-hover">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm font-bold text-white">${m.title}</p>
                <p class="text-xs text-slate-400">${m.category}</p>
              </div>
              <button onclick="event.stopPropagation(); app.toggleBookmark('${m.id}')" class="text-amber-300"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></button>
            </div>
          </div>
        `).join('') : '<p class="text-center text-sm text-slate-500 py-8">Belum ada bookmark.</p>'}
      </div>
    </div>`;
  },

  /* ---------- RENDER: STATS ---------- */
  renderStats() {
    const totalMats = MATERIALS.length;
    const readCount = Object.keys(this.progress).filter(k => this.progress[k]>=100).length;
    const totalFlash = this.totalFlashcards();
    const knownFlash = Object.keys(this.flashProgress).length;
    const totalQ = Object.values(this.quizScores).reduce((a,b)=>a+(b.total||0),0);
    const correctQ = Object.values(this.quizScores).reduce((a,b)=>a+(b.correct||0),0);
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 space-y-4 max-w-lg mx-auto">
      <h2 class="text-xl font-bold text-white">Statistik</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="glass rounded-2xl p-4 text-center">
          <div class="text-2xl font-bold text-cyan-300">${readCount}</div>
          <p class="text-[10px] text-slate-400">Materi Selesai</p>
        </div>
        <div class="glass rounded-2xl p-4 text-center">
          <div class="text-2xl font-bold text-purple-300">${knownFlash}</div>
          <p class="text-[10px] text-slate-400">Flashcard Hafal</p>
        </div>
        <div class="glass rounded-2xl p-4 text-center">
          <div class="text-2xl font-bold text-emerald-300">${totalQ?Math.round((correctQ/totalQ)*100):0}%</div>
          <p class="text-[10px] text-slate-400">Akurasi Kuis</p>
        </div>
        <div class="glass rounded-2xl p-4 text-center">
          <div class="text-2xl font-bold text-amber-300">${Math.floor(this.timerStats.total/60)}</div>
          <p class="text-[10px] text-slate-400">Menit Fokus</p>
        </div>
      </div>
      <div class="glass rounded-2xl p-4">
        <h3 class="text-sm font-bold text-white mb-2">Progress per Materi</h3>
        ${MATERIALS.map(m => `
          <div class="flex items-center gap-2 py-2 border-b border-white/5 last:border-0">
            <span class="text-xs text-slate-400 w-24 truncate">${m.title}</span>
            <div class="flex-1 h-1.5 bg-white/5 rounded-full"><div class="h-full bg-cyan-400 rounded-full" style="width:${this.progress[m.id]||0}%"></div></div>
            <span class="text-[10px] text-slate-500 w-8 text-right">${this.progress[m.id]||0}%</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  },

  /* ---------- RENDER: POMODORO ---------- */
  renderPomodoro() {
    const t = this.pomodoro.time;
    const m = Math.floor(t/60);
    const s = t%60;
    const total = this.pomodoro.mode==='focus'?25*60:(this.pomodoro.mode==='short'?5*60:15*60);
    const pct = ((total-t)/total)*100;
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-8 max-w-lg mx-auto text-center">
      <h2 class="text-xl font-bold text-white mb-6">Pomodoro Timer</h2>
      <div class="relative w-64 h-64 mx-auto mb-8">
        <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4"/>
          <circle cx="50" cy="50" r="45" fill="none" stroke="var(--accent-cyan)" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="283" stroke-dashoffset="${283 - (283*pct/100)}" class="timer-ring"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div id="pomoDisplay" class="text-5xl font-mono font-bold text-white">${m}:${s.toString().padStart(2,'0')}</div>
          <p class="text-xs text-slate-400 mt-1 capitalize">${this.pomodoro.mode==='focus'?'Fokus Belajar':this.pomodoro.mode==='short'?'Istirahat Pendek':'Istirahat Panjang'}</p>
        </div>
      </div>
      <div class="flex items-center justify-center gap-3 mb-6">
        <button onclick="app.setPomoMode('focus')" class="px-3 py-1.5 rounded-lg text-xs ${this.pomodoro.mode==='focus'?'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30':'glass text-slate-400'}">Fokus</button>
        <button onclick="app.setPomoMode('short')" class="px-3 py-1.5 rounded-lg text-xs ${this.pomodoro.mode==='short'?'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30':'glass text-slate-400'}">Pendek</button>
        <button onclick="app.setPomoMode('long')" class="px-3 py-1.5 rounded-lg text-xs ${this.pomodoro.mode==='long'?'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30':'glass text-slate-400'}">Panjang</button>
      </div>
      <div class="flex items-center justify-center gap-4">
        <button onclick="app.togglePomo()" id="pomoToggle" class="w-14 h-14 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-300 border border-cyan-500/30 hover:bg-cyan-500/30">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button onclick="app.resetPomo()" class="w-12 h-12 rounded-full glass flex items-center justify-center text-slate-400 hover:text-white">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
      <p class="text-xs text-slate-500 mt-6">Total fokus: ${Math.floor(this.timerStats.total/60)} menit • ${this.timerStats.sessions} sesi</p>
    </div>`;
  },

  setPomoMode(mode) {
    this.pomodoro.mode = mode;
    this.pomodoro.time = mode==='focus'?25*60:(mode==='short'?5*60:15*60);
    this.pomodoro.running = false;
    clearInterval(this.pomodoro.interval);
    this.renderPomodoro();
  },

  togglePomo() {
    if(this.pomodoro.running) {
      clearInterval(this.pomodoro.interval);
      this.pomodoro.running = false;
    } else {
      this.pomodoro.running = true;
      this.pomodoro.interval = setInterval(() => {
        this.pomodoro.time--;
        const el = document.getElementById('pomoDisplay');
        if(el) {
          const m = Math.floor(this.pomodoro.time/60);
          const s = this.pomodoro.time%60;
          el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
        }
        // Update ring via re-render is heavy; skip for performance, just update text
        if(this.pomodoro.time <= 0) {
          clearInterval(this.pomodoro.interval);
          this.pomodoro.running = false;
          this.timerStats.total += (this.pomodoro.mode==='focus'?25*60:(this.pomodoro.mode==='short'?5*60:15*60)) - this.pomodoro.time;
          this.timerStats.sessions++;
          this.save();
          this.toast('Timer selesai! 🎉');
          this.renderPomodoro();
        }
      }, 1000);
    }
    this.renderPomodoro();
  },

  resetPomo() {
    clearInterval(this.pomodoro.interval);
    this.pomodoro.running = false;
    this.pomodoro.time = this.pomodoro.mode==='focus'?25*60:(this.pomodoro.mode==='short'?5*60:15*60);
    this.renderPomodoro();
  },

  /* ---------- RENDER: SETTINGS ---------- */
  renderSettings() {
    document.getElementById('mainContent').innerHTML = `
    <div class="page active px-4 py-4 space-y-4 max-w-lg mx-auto">
      <h2 class="text-xl font-bold text-white">Pengaturan</h2>
      <div class="glass rounded-2xl overflow-hidden">
        <button onclick="if(confirm('Reset semua progress?')){localStorage.clear(); location.reload();}" class="w-full px-4 py-3 text-left text-sm text-rose-300 hover:bg-rose-500/5 flex items-center justify-between">
          <span>Reset Semua Data</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="glass rounded-2xl p-4">
        <p class="text-xs text-slate-500">MedStudy v1.0 • Dibuat untuk mahasiswa FKIK UNJA</p>
        <p class="text-xs text-slate-600 mt-1">Semua data disimpan secara lokal di perangkat ini.</p>
      </div>
    </div>`;
  },

  /* ---------- SEARCH ---------- */
  toggleSearch() {
    const el = document.getElementById('searchOverlay');
    el.classList.toggle('hidden');
    if(!el.classList.contains('hidden')) {
      setTimeout(() => document.getElementById('globalSearchInput').focus(), 100);
      this.handleSearch(document.getElementById('globalSearchInput').value);
    }
  },

  handleSearch(q) {
    const res = document.getElementById('searchResults');
    if(!q.trim()) { res.innerHTML = '<p class="text-xs text-slate-500 p-2">Ketik untuk mencari...</p>'; return; }
    const term = q.toLowerCase();
    let hits = [];
    MATERIALS.forEach(m => {
      if(m.title.toLowerCase().includes(term) || m.summary.toLowerCase().includes(term)) hits.push({type:'Materi', title:m.title, subtitle:m.summary, action:`app.goTo('material','${m.id}'); app.toggleSearch()`});
      m.flashcards.forEach((f,i) => { if(f.q.toLowerCase().includes(term) || f.a.toLowerCase().includes(term)) hits.push({type:'Flashcard', title:f.q.substring(0,60), subtitle:m.title, action:`app.goTo('flashcards','${m.id}'); app.toggleSearch()`}); });
    });
    this.notes.forEach((n,i) => { if(n.title.toLowerCase().includes(term) || n.body.toLowerCase().includes(term)) hits.push({type:'Catatan', title:n.title, subtitle:n.body.substring(0,60), action:`app.editNote(${i}); app.toggleSearch()`}); });
    res.innerHTML = hits.length ? hits.slice(0,8).map(h => `
      <button onclick="${h.action}" class="w-full text-left glass rounded-xl p-3 hover:bg-white/5">
        <span class="text-[10px] uppercase tracking-wider text-cyan-400 font-semibold">${h.type}</span>
        <p class="text-sm text-white mt-0.5">${h.title}</p>
        <p class="text-xs text-slate-500 truncate">${h.subtitle}</p>
      </button>
    `).join('') : '<p class="text-xs text-slate-500 p-2">Tidak ditemukan.</p>';
  },

  /* ---------- UTILS ---------- */
  toast(msg) {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast glass-strong rounded-xl px-4 py-2.5 text-sm text-white shadow-xl border border-white/10 mx-auto max-w-sm text-center';
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },

  renderParticles() {
    const container = document.getElementById('particles');
    for(let i=0;i<12;i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random()*3+1;
      p.style.width = size+'px'; p.style.height = size+'px';
      p.style.left = Math.random()*100+'%';
      p.style.animationDuration = (Math.random()*15+15)+'s';
      p.style.animationDelay = (Math.random()*10)+'s';
      container.appendChild(p);
    }
  }
};

// Initialize
app.init();
</script>
</body>
</html>
